name: Build Tadpole nerfed HayBox

on:
  push:
    branches:
      - tadpole-nerfed-custom
    paths:
      - 'tadpole/**'
      - '.github/workflows/tadpole.yml'
  workflow_dispatch:

jobs:
  build-tadpole:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout custom Tadpole patch
        uses: actions/checkout@v4

      - name: Checkout CarVac nerfed HayBox source
        uses: actions/checkout@v4
        with:
          repository: CarVac/HayBox
          ref: e0e6cbb3703880de86325a6002bd64238fd1b652 # CarVac master as of 2025-04-23
          path: upstream-haybox
          persist-credentials: false

      - name: Apply custom Tadpole mapping
        working-directory: upstream-haybox
        run: |
          git apply --check ../tadpole/tadpole_nerfed_haybox.patch
          git apply ../tadpole/tadpole_nerfed_haybox.patch
          git diff --check
          git diff --stat

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Compile Pico UF2
        working-directory: upstream-haybox
        run: |
          # The current pioasm generates a field missing from the older
          # RP2040 SDK embedded in Arduino-Pico 3.6.3.
          # First run creates joybus.pio.h. On failure, strip that
          # incompatible metadata field and retry without touching gameplay code.
          if ! pio run -e pico; then
            HEADER=".pio/libdeps/pico/joybus-pio/src/joybus.pio.h"
            if ! test -f "$HEADER" || ! grep -q 'pio_version = joybus_pio_version' "$HEADER"; then
              echo "Build failed for an unrelated reason; see log above."
              exit 1
            fi
            sed -i '/\.pio_version = joybus_pio_version,/d' "$HEADER"
            pio run -e pico
          fi

      - name: Upload Tadpole UF2
        uses: actions/upload-artifact@v4
        with:
          name: Tadpole-CarVac-nerfed-custom-UF2
          path: upstream-haybox/.pio/build/pico/firmware.uf2
          if-no-files-found: error
